<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宅建業法 罰則暗記クイズ</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.25rem;
            color: #1f4e78;
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .score-board {
            display: flex;
            justify-content: space-between;
            background: #f2f5f9;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .question-box {
            background: #fafbfc;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .violation-text {
            font-size: 1.05rem;
            font-weight: bold;
            color: #24292e;
            line-height: 1.5;
        }
        /* 選択した文章のライブプレビュー枠 */
        .preview-box {
            background: #eef2f7;
            border-left: 4px solid #1f4e78;
            padding: 12px 15px;
            border-radius: 0 6px 6px 0;
            margin-bottom: 20px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #1f4e78;
            min-height: 24px;
            display: flex;
            align-items: center;
        }
        .section-title {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #444;
        }
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }
        .choice-btn {
            flex: 1 1 calc(33% - 8px);
            padding: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            border: 2px solid #cbd5e1;
            background-color: #fff;
            color: #334155;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .choice-btn:hover {
            border-color: #1f4e78;
            background-color: #f1f5f9;
        }
        .choice-btn.selected {
            background-color: #1f4e78;
            color: #fff;
            border-color: #1f4e78;
        }
        .btn {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            background-color: #1f4e78;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 8px;
        }
        .btn:hover {
            background-color: #15395b;
        }
        .btn-pass {
            background-color: #6c757d;
        }
        .btn-pass:hover {
            background-color: #5a6268;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            display: none;
        }
        .correct {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .incorrect {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .explanation {
            margin-top: 10px;
            font-size: 0.9rem;
            text-align: left;
            font-weight: normal;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="app-title">宅建業法 罰則暗記クイズ</h1>
    
    <div class="score-board">
        <span id="progress-text">問題: 1 / 26</span>
        <span id="score-text">正解数: 0</span>
    </div>

    <div class="question-box">
        <div id="violation" class="violation-text">ここに違反内容が表示されます</div>
    </div>

    <!-- 選択結果のライブプレビュー -->
    <div id="preview-text" class="preview-box">選択してください</div>

    <div class="section-title">拘禁刑（自由刑）</div>
    <div id="prison-choices" class="button-group"></div>

    <div class="section-title">罰金・過料</div>
    <div id="fine-choices" class="button-group"></div>

    <!-- アクションボタン群 -->
    <div id="action-buttons">
        <button id="submit-btn" class="btn" onclick="checkAnswer()">確定する</button>
        <button id="pass-btn" class="btn btn-pass" onclick="passQuestion()">パスする（後で解く）</button>
    </div>

    <div id="result-box" class="result-box">
        <div id="result-title"></div>
        <div id="explanation" class="explanation"></div>
    </div>
    
    <button id="next-btn" class="btn" style="margin-top: 15px; display: none; background-color: #28a745;" onclick="nextQuestion()">次の問題へ</button>
</div>

<script>
    const quizData = [
        { text: "不正の手段により免許を受けた者", prison: "3年", fine: "300万円" },
        { text: "無免許で事業をした者", prison: "3年", fine: "300万円" },
        { text: "名義貸しをして他人に宅建業を営ませた者", prison: "3年", fine: "300万円" },
        { text: "業務停止処分に違反して業務を営んだ者", prison: "3年", fine: "300万円" },
        { text: "契約の勧誘をするとき等に、重要な事実を故意に告げなかったり、不実を告げた者", prison: "2年", fine: "300万円" },
        { text: "不当に高額の報酬を要求した者", prison: "1年", fine: "100万円" },
        { text: "営業保証金の供託の届出前に事業を開始した者", prison: "6か月", fine: "100万円" },
        { text: "誇大広告等の禁止に違反した者", prison: "6か月", fine: "100万円" },
        { text: "不当な履行遅延行為をした者", prison: "6か月", fine: "100万円" },
        { text: "手付の貸付け等をすることにより、契約の締結を誘引した者", prison: "6か月", fine: "100万円" },
        { text: "無免許で宅建業者としての表示・広告をした者", prison: "なし", fine: "100万円" },
        { text: "名義貸しをして他人に宅建業の表示・広告をさせた者", prison: "なし", fine: "100万円" },
        { text: "専任の宅建士の設置義務に違反した者", prison: "なし", fine: "100万円" },
        { text: "報酬限度額を超えて報酬を受領した者", prison: "なし", fine: "100万円" },
        { text: "変更の届出をしなかったり、虚偽の届出をした者", prison: "なし", fine: "50万円" },
        { text: "37条書面の交付（または電磁的方法による提供）をしなかった者", prison: "なし", fine: "50万円" },
        { text: "事務所に報酬の額を掲示しなかった者", prison: "なし", fine: "50万円" },
        { text: "従業者に従業者証明書を携帯させなかった者", prison: "なし", fine: "50万円" },
        { text: "標識を掲示しなかった者", prison: "なし", fine: "50万円" },
        { text: "守秘義務違反をした者", prison: "なし", fine: "50万円" },
        { text: "帳簿や従業者名簿を備え付けなかったり、記載すべき事項を記載しなかったり、虚偽の記載をした者", prison: "なし", fine: "50万円" },
        { text: "業務について報告を求められても報告しなかったり、虚偽の報告をした者", prison: "なし", fine: "50万円" },
        { text: "国土交通大臣または都道府県知事の立ち入り検査を拒んだり、妨げたり、忌避した者", prison: "なし", fine: "50万円" },
        { text: "宅建士証の返納義務に違反した者", prison: "なし", fine: "10万円" },
        { text: "宅建士証の提出義務に違反した者", prison: "なし", fine: "10万円" },
        { text: "重要事項の説明時に、宅建士証を提示しなかった者", prison: "なし", fine: "10万円" }
    ];

    const prisonOptions = ["なし", "3年", "2年", "1年", "6か月"];
    const fineOptions = ["なし", "300万円", "100万円", "50万円", "10万円"];

    let currentQuestions = [];
    let incorrectQuestions = []; // 間違えた問題
    let passedQuestions = [];    // パスした問題
    let currentIndex = 0;
    let score = 0;
    let selectedPrison = "";
    let selectedFine = "";
    let isReviewMode = false;

    function initQuiz() {
        currentQuestions = [...quizData].sort(() => Math.random() - 0.5);
        incorrectQuestions = [];
        passedQuestions = [];
        currentIndex = 0;
        score = 0;
        isReviewMode = false;
        document.getElementById("app-title").textContent = "宅建業法 罰則暗記クイズ";
        loadQuestion();
    }

    function initReviewQuiz() {
        // 間違えた問題とパスした問題を合わせる（またはパスした問題だけでもOKですが、両方まとめて再挑戦できるようにしています）
        const retryList = [...incorrectQuestions, ...passedQuestions];
        if (retryList.length === 0) {
            alert("復習する問題はありません！");
            initQuiz();
            return;
        }
        currentQuestions = [...new Set(retryList)].sort(() => Math.random() - 0.5);
        incorrectQuestions = [];
        passedQuestions = [];
        currentIndex = 0;
        score = 0;
        isReviewMode = true;
        document.getElementById("app-title").textContent = "宅建業法 罰則暗記クイズ（復習・パス問題モード）";
        loadQuestion();
    }

    // 選択された内容からきれいな文章を組み立てる関数
    function updatePreview() {
        const previewEl = document.getElementById("preview-text");
        if (!selectedPrison || !selectedFine) {
            previewEl.textContent = "拘禁刑と罰金（または「なし」）を選んでください";
            return;
        }

        let text = "";
        if (selectedPrison === "なし" && selectedFine === "なし") {
            text = "罰則なし";
        } else if (selectedPrison === "なし") {
            text = `${selectedFine}以下の罰金（または過料）`;
        } else if (selectedFine === "なし") {
            text = `${selectedPrison}以下の拘禁刑`;
        } else {
            text = `${selectedPrison}以下の拘禁刑もしくは${selectedFine}以下の罰金またはこれらの併科`;
        }
        previewEl.textContent = text;
    }

    function renderButtons() {
        const prisonContainer = document.getElementById("prison-choices");
        prisonContainer.innerHTML = "";
        prisonOptions.forEach(opt => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "choice-btn" + (selectedPrison === opt ? " selected" : "");
            btn.textContent = opt;
            btn.onclick = () => {
                selectedPrison = opt;
                renderButtons();
                updatePreview();
            };
            prisonContainer.appendChild(btn);
        });

        const fineContainer = document.getElementById("fine-choices");
        fineContainer.innerHTML = "";
        fineOptions.forEach(opt => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "choice-btn" + (selectedFine === opt ? " selected" : "");
            btn.textContent = opt;
            btn.onclick = () => {
                selectedFine = opt;
                renderButtons();
                updatePreview();
            };
            fineContainer.appendChild(btn);
        });
    }

    function loadQuestion() {
        const q = currentQuestions[currentIndex];
        document.getElementById("violation").textContent = "「" + q.text + "」";
        
        selectedPrison = "";
        selectedFine = "";
        renderButtons();
        updatePreview();
        
        document.getElementById("progress-text").textContent = `問題: ${currentIndex + 1} / ${currentQuestions.length}`;
        document.getElementById("score-text").textContent = `正解数: ${score}`;
        
        document.getElementById("result-box").style.display = "none";
        document.getElementById("action-buttons").style.display = "block";
        document.getElementById("submit-btn").style.display = "block";
        document.getElementById("pass-btn").style.display = "block";
        document.getElementById("next-btn").style.display = "none";
    }

    // パスボタンが押されたときの処理
    function passQuestion() {
        const q = currentQuestions[currentIndex];
        // パスリストに追加（重複防止）
        if (!passedQuestions.some(item => item.text === q.text)) {
            passedQuestions.push(q);
        }
        nextQuestion();
    }

    function checkAnswer() {
        if (!selectedPrison || !selectedFine) {
            alert("拘禁刑と罰金（または「なし」）の両方を選択してください。");
            return;
        }

        const q = currentQuestions[currentIndex];
        const isCorrect = (selectedPrison === q.prison && selectedFine === q.fine);

        if (isCorrect) {
            score++;
            document.getElementById("score-text").textContent = `正解数: ${score}`;
        } else {
            // 間違えた問題を蓄積（重複防止）
            if (!incorrectQuestions.some(item => item.text === q.text)) {
                incorrectQuestions.push(q);
            }
        }

        const resultBox = document.getElementById("result-box");
        const resultTitle = document.getElementById("result-title");
        const explanation = document.getElementById("explanation");

        resultBox.style.display = "block";
        if (isCorrect) {
            resultBox.className = "result-box correct";
            resultTitle.textContent = "正解！ 🎉";
        } else {
            resultBox.className = "result-box incorrect";
            resultTitle.textContent = "不正解… 😢";
        }

        let correctText = "";
        if (q.prison === "なし") {
            correctText = `${q.fine}以下の罰金（または過料）`;
        } else {
            correctText = `${q.prison}以下の拘禁刑もしくは${q.fine}以下の罰金またはこれらの併科`;
        }

        explanation.innerHTML = `正解は：<br><strong>${correctText}</strong>`;

        document.getElementById("action-buttons").style.display = "none";
        
        if (currentIndex < currentQuestions.length - 1) {
            document.getElementById("next-btn").style.display = "block";
            document.getElementById("next-btn").textContent = "次の問題へ";
        } else {
            document.getElementById("next-btn").style.display = "block";
            const totalReviewCount = incorrectQuestions.length + passedQuestions.length;
            if (!isReviewMode && totalReviewCount > 0) {
                document.getElementById("next-btn").textContent = `パス・間違えた問題 (${totalReviewCount}問) を復習する`;
            } else {
                document.getElementById("next-btn").textContent = "最初からもう一度挑戦する";
            }
        }
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            loadQuestion();
        } else {
            const totalReviewCount = incorrectQuestions.length + passedQuestions.length;
            if (!isReviewMode && totalReviewCount > 0) {
                initReviewQuiz();
            } else {
                alert(`お疲れ様でした！すべての学習が完了しました。`);
                initQuiz();
            }
        }
    }

    initQuiz();
</script>

</body>
</html>
